<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' | escape }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.data.cv.profile.name | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.data.cv.seo.description | escape }}" />
  <meta name="author" content="{{ site.data.cv.profile.name | escape }}" />
  <meta name="cv-content-source" content="_data/cv.yml" />
  {% if page.noindex %}<meta name="robots" content="noindex, nofollow" />{% endif %}
  <meta property="og:type" content="website" />
  <meta property="og:title" content="{{ page.title | default: site.data.cv.profile.name | escape }}" />
  <meta property="og:description" content="{{ page.description | default: site.data.cv.seo.social_description | escape }}" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>" />
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}?v={{ site.time | date: '%s' }}" />
  <script>
    (function () {
      var saved;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode" hidden>
    <span class="theme-icon-light">☀︎</span>
    <span class="theme-icon-dark">☾</span>
  </button>
  <main{% if page.noindex %} class="manage"{% endif %}>
    {{ content }}
    <footer>
      <p>© {{ site.time | date: '%Y' }} {{ site.data.cv.profile.name | escape }} · Built with Jekyll &amp; Liquid · Hosted on GitHub Pages</p>
    </footer>
  </main>
  <script>
    var toggle = document.getElementById("theme-toggle");
    toggle.hidden = false;
    toggle.addEventListener("click", function () {
      var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("theme", next); } catch (e) {}
    });
  </script>
</body>
</html>
