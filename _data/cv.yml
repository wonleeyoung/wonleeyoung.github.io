about: |
  I am a Ph.D. student in the Department of Computer Science at Yonsei University, advised by Prof. Jinkyu Lee. My research lies at the intersection of **real-time systems**, **intermittent computing**, and **on-device machine learning** — building systems that deliver timely and accurate inference under tight energy and latency constraints.

