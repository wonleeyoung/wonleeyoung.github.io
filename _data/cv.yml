about: |
  I am a Ph.D. student in the Department of Computer Science at Yonsei University, advised by [Prof. Jinkyu Lee](https://rtcl-yonsei.github.io/website/). My research interests include **real-time systems, on-device machine learning, and physical AI**. I am open to research collaborations and would be happy to connect with researchers who share these interests. If you are interested in working together, please feel free to contact me at [wonyeong.lee@yonsei.ac.kr](mailto:wonyeong.lee@yonsei.ac.kr).

